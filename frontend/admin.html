<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GiveGrid — NGO verification</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark"><span></span><span></span><span></span><span></span></span>GiveGrid</a>
    <span id="who" class="who"></span>
    <button id="logout" class="button-quiet">Log out</button>
  </header>

  <main class="app">
    <div class="page-head">
      <div>
        <h1>NGO verification</h1>
        <p class="summary">Check each NGO before it can post needs or claim donations.
          Verified NGOs can start at once; rejected ones can be verified later if you change your mind.</p>
      </div>
    </div>

    <!-- One tab per status: each shows the same table, filtered by that status. -->
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="PENDING" role="tab">Waiting <span id="pending-count" class="count"></span></button>
      <button class="tab" data-tab="VERIFIED" role="tab">Verified</button>
      <button class="tab" data-tab="REJECTED" role="tab">Rejected</button>
    </nav>

    <div id="ngos"></div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
