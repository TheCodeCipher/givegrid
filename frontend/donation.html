<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GiveGrid — Donation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark"><span></span><span></span><span></span><span></span></span>GiveGrid</a>
    <span id="who" class="who"></span>
    <button id="logout" class="button-quiet">Log out</button>
  </header>

  <main class="app">
    <a id="back" class="back" href="index.html">Back to your dashboard</a>

    <div class="split">
      <section>
        <div id="details"><p class="muted">Loading…</p></div>

        <!-- Only for the donor who owns this donation -->
        <div id="best-needs-area" class="hidden">
          <h2>NGOs that need this most</h2>
          <p class="panel-intro">Score: urgency (+30 high, +15 medium), covers their whole need (+30), nearby (+20 same area, +10 same city).</p>
          <div id="best-needs"></div>
        </div>

        <h2>History</h2>
        <p class="panel-intro">Every step is recorded permanently and cannot be changed.</p>
        <div id="history"></div>
      </section>

      <!-- Only for the donor who owns this donation -->
      <aside id="owner-area" class="side-panel hidden">
        <form id="edit-form" class="card stack">
          <h2>Edit details</h2>
          <label>Title <input name="title" id="edit-title" required></label>
          <label>Description <textarea name="description" id="edit-description" rows="3"></textarea></label>
          <div class="actions">
            <button type="submit">Save changes</button>
            <button type="button" id="close-button" class="danger">Stop new claims</button>
          </div>
          <p id="edit-message"></p>
        </form>
      </aside>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/donation.js"></script>
</body>
</html>
